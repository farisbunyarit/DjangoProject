{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Product — Gear Ratio</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'admin.css' %}"
    >

</head>

<body>


<header class="admin-header">

    <div class="admin-logo">
        Gear <span>Ratio</span>
    </div>

    <div class="admin-title">
        Add Product
    </div>

</header>


<main class="admin-container">


    <div class="admin-welcome">

        <h1>Add Product</h1>

        <p>
            Add a new motorcycle part to your store.
        </p>

    </div>


    <section class="admin-section">


        <div class="admin-section-header">

            <h2>Product Information</h2>

            <div class="admin-actions">

                <a
                    href="{% url 'admin_products' %}"
                    class="admin-btn"
                >
                    Back To Products
                </a>

                <a
                    href="{% url 'admin_dashboard' %}"
                    class="admin-btn"
                >
                    Dashboard
                </a>

            </div>

        </div>


        {% if error %}

            <div class="form-error">
                {{ error }}
            </div>

        {% endif %}


        <form
            method="post"
            class="admin-form"
        >

            {% csrf_token %}


            <div class="form-group">

                <label for="name">
                    Product Name *
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Example: Racing Exhaust"
                    required
                >

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="4"
                    placeholder="Product description..."
                ></textarea>

            </div>


            <div class="form-row">


                <div class="form-group">

                    <label for="price">
                        Price *
                    </label>

                    <input
                        type="number"
                        id="price"
                        name="price"
                        step="0.01"
                        min="0"
                        placeholder="149.99"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Category *
                    </label>

                    <select
                        id="category"
                        name="category"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                        {% for category in categories %}

                            <option value="{{ category.id }}">
                                {{ category.icon }} {{ category.name }}
                            </option>

                        {% endfor %}

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label for="image">
                    Image URL
                </label>

                <input
                    type="url"
                    id="image"
                    name="image"
                    placeholder="https://example.com/product.jpg"
                >

            </div>


            <div class="form-row">


                <div class="form-group">

                    <label for="badge">
                        Badge
                    </label>

                    <input
                        type="text"
                        id="badge"
                        name="badge"
                        placeholder="NEW"
                    >

                </div>


                <div class="form-group">

                    <label for="badge_class">
                        Badge Class
                    </label>

                    <select
                        id="badge_class"
                        name="badge_class"
                    >

                        <option value="">
                            None
                        </option>

                        <option value="gold">
                            Gold
                        </option>

                        <option value="dark">
                            Dark
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label for="icon">
                    Icon
                </label>

                <input
                    type="text"
                    id="icon"
                    name="icon"
                    maxlength="10"
                    placeholder="🏍️"
                >

            </div>


            <div class="form-actions">

                <a
                    href="{% url 'admin_products' %}"
                    class="admin-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="admin-btn gold"
                >
                    Save Product
                </button>

            </div>


        </form>

    </section>

</main>


<footer class="admin-footer">

    © 2026 <span>Gear Ratio</span> · Add Product

</footer>


</body>

</html>
